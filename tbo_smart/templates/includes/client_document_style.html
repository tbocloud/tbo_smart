{#- the white paper of every client document's page and PDF (docs/proposals.md §5.1) #}
<style>
	{%- for face in p.fonts or [] %}
	@font-face { font-family: Geist; font-style: normal; font-weight: {{ face.weight }}; src: url("{{ face.src }}"); }
	{%- endfor %}
	/* One theme: white paper (#ffffff), dark ink (#1c1b19), the TBO teal (#3a748d) only for
	   numbers, the headings' rule and the timeline. Readable in grayscale: nothing depends on the
	   colour alone. Colours are written out, not CSS variables: wkhtmltopdf's WebKit has none, nor
	   flexbox or grid. One font, Geist, bundled with tabular figures (docs/proposals.md §5.1). */
	* { box-sizing: border-box; }
	html { background: #ffffff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
	body {
		margin: 0; background: #ffffff; color: #1c1b19;
		font: 15px/1.65 Geist, "Helvetica Neue", Helvetica, Arial, sans-serif;
	}
	.wrap { max-width: 880px; margin: 0 auto; padding: 32px 16px 64px; }
	.sheet { background: #ffffff; border: 1px solid #e3ddcd; border-radius: 4px; }
	.pad { padding-left: 56px; padding-right: 56px; }

	/* letter head */
	.letter-head { padding-top: 20px; padding-bottom: 16px; border-bottom: 1px solid #e3ddcd; }
	.letter-head-footer { padding-top: 12px; padding-bottom: 16px; border-top: 1px solid #e3ddcd; color: #67625a; font-size: 12px; }
	.letter-head img, .letter-head-footer img { max-width: 100%; max-height: 90px; }
	.letter-head-footer img { max-height: 140px; }
	.align-center { text-align: center; }
	.align-right { text-align: right; }
	header.brand { padding-top: 20px; padding-bottom: 16px; border-bottom: 1px solid #e3ddcd; }
	header.brand img { max-height: 40px; max-width: 180px; vertical-align: middle; }
	header.brand .company { font-weight: 600; color: #3d3a34; }

	/* the cover */
	.cover { padding-top: 72px; padding-bottom: 56px; }
	.cover table { margin: 0; page-break-inside: auto; }
	.cover td { padding: 0; border-bottom: 0; color: inherit; font-weight: 400; }
	.cover-grid { width: 100%; }
	.cover-grid td.top { vertical-align: top; }
	.cover-grid td.bottom { vertical-align: bottom; padding-top: 48px; }
	.cover .logo { max-height: 56px; max-width: 220px; margin-bottom: 48px; }
	.kicker { margin: 0 0 16px; color: #2c5f75; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
	.cover h1 { margin: 0; font-size: 40px; line-height: 1.15; font-weight: 600; letter-spacing: -.01em; color: #1c1b19; }
	.cover .rule { width: 72px; height: 4px; background: #3a748d; margin: 28px 0; }
	.cover .tagline p { font-size: 17px; color: #3d3a34; margin: 20px 0 0; }
	.cover figure { margin: 32px 0 0; }
	.facts { width: 100%; border-collapse: collapse; }
	.cover .facts td { width: 33.3%; padding: 12px 16px 12px 0; border-top: 1px solid #e3ddcd; vertical-align: top; font-weight: 400; }
	.facts .label { display: block; color: #67625a; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
	.facts .value { display: block; margin-top: 2px; color: #1c1b19; font-variant-numeric: tabular-nums; }
	.cover .cover-foot { width: 100%; margin-top: 24px; }
	.cover .cover-foot td { padding-top: 10px; border-top: 1px solid #cfc7b3; color: #67625a; font-size: 12px; font-weight: 400; }

	/* notices (the web page only) */
	.notice { margin: 16px 0 0; padding: 12px 16px; border-radius: 6px; font-size: 14px; }
	.notice.info { background: #e7eff1; color: #2c5f75; }
	.notice.success { background: #e5f1e8; color: #1f6b45; }
	.notice.danger { background: #f8e5e1; color: #a32116; }
	.notice strong { font-weight: 600; }

	/* contents */
	.toc { padding-top: 48px; padding-bottom: 40px; border-top: 1px solid #e3ddcd; }
	.toc h2 { margin: 0 0 12px; font-size: 24px; font-weight: 600; }
	.toc .part-title { margin: 14px 0 4px; color: #2c5f75; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
	.toc ol { list-style: none; margin: 0; padding: 0; }
	.toc li { padding: 3px 0; font-size: 14px; border-bottom: 1px dotted #cfc7b3; color: #3d3a34; }
	.toc a { color: inherit; text-decoration: none; }
	.toc .n { display: inline-block; width: 36px; color: #2c5f75; font-variant-numeric: tabular-nums; }

	/* parts and sections */
	.part { padding-top: 48px; padding-bottom: 8px; border-top: 1px solid #e3ddcd; }
	.part p { margin: 0; color: #2c5f75; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
	section.block { padding-top: 32px; padding-bottom: 8px; }
	/* a heading never ends a page: it is kept with the first thing under it */
	.keep { page-break-inside: avoid; }
	section.block h2 { margin: 0 0 16px; padding-bottom: 10px; border-bottom: 2px solid #3a748d; font-size: 22px; line-height: 1.3; font-weight: 600; page-break-after: avoid; }
	section.block h2 .n { color: #2c5f75; margin-right: 12px; font-weight: 500; }
	h3 { margin: 22px 0 8px; font-size: 16px; font-weight: 600; color: #1c1b19; page-break-after: avoid; }
	h3 .n { color: #2c5f75; margin-right: 8px; font-weight: 500; }
	p { margin: 0 0 12px; color: #3d3a34; }
	ul { margin: 0 0 12px; padding-left: 20px; color: #3d3a34; }
	li { margin-bottom: 4px; }

	/* tables */
	table { width: 100%; border-collapse: collapse; margin: 8px 0 16px; font-size: 14px; page-break-inside: avoid; }
	thead { display: table-header-group; }
	tr { page-break-inside: avoid; }
	th { text-align: left; font-weight: 600; color: #67625a; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; padding: 8px 12px 8px 0; border-bottom: 1px solid #cfc7b3; }
	td { padding: 10px 12px 10px 0; border-bottom: 1px solid #e3ddcd; vertical-align: top; color: #3d3a34; }
	td:first-child { color: #1c1b19; font-weight: 500; }
	/* requirement IDs (FR-1.1) stay on one line; tabular figures keep them aligned in one font */
	table.ids td:first-child { white-space: nowrap; font-size: 13px; }
	.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-right: 0; }
	td .desc { display: block; color: #67625a; font-size: 13px; font-weight: 400; margin-top: 2px; }
	.totals { width: 55%; margin-left: 45%; }
	.totals td { border-bottom: 0; padding: 5px 0; font-weight: 400; }
	.totals tr.grand td { padding-top: 12px; border-top: 2px solid #1c1b19; font-weight: 600; font-size: 17px; color: #1c1b19; }
	.words { font-size: 13px; color: #67625a; text-align: right; }

	/* the module map */
	.cards { margin: 4px -6px 12px; font-size: 0; }
	.card { display: inline-block; vertical-align: top; width: 50%; padding: 6px; font-size: 14px; page-break-inside: avoid; }
	.card .in { border: 1px solid #e3ddcd; border-top: 3px solid #3a748d; border-radius: 4px; background: #ffffff; padding: 14px 16px; min-height: 128px; }
	.card .name { font-weight: 600; color: #1c1b19; }
	.card .fit { display: inline-block; margin-left: 6px; padding: 0 8px; border: 1px solid #cfc7b3; border-radius: 999px; font-size: 11px; color: #67625a; }
	.card .about { margin: 8px 0 0; font-size: 13px; color: #3d3a34; }
	.card ul { margin: 8px 0 0; font-size: 13px; }

	/* the AMC plans: a card each, side by side (inline blocks: the PDF's renderer has no grid) */
	.plans { margin: 12px -6px 4px; font-size: 0; }
	.plan { display: inline-block; vertical-align: top; width: 50%; padding: 6px; font-size: 14px; page-break-inside: avoid; }
	.plans-1 .plan { width: 100%; }
	.plans-3 .plan { width: 33.33%; }
	.plans-4 .plan { width: 25%; }
	.plan .in { border: 1px solid #e3ddcd; border-radius: 10px; background: #fff; overflow: hidden; }
	.plan .in.pick { border: 2px solid #3a748d; box-shadow: 0 6px 18px rgba(58, 116, 141, .18); }
	.plan .head { padding: 14px 16px 16px; background: #f3f4f6; color: #1c1b19; }
	.plan .pick .head { background: #3a748d; color: #fff; }
	.plan .tag { float: right; margin: 1px 0 0 8px; padding: 1px 8px; border: 1px solid currentColor; border-radius: 999px; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
	.plan .name { display: block; font-weight: 600; font-size: 16px; }
	.plan .fee { display: block; margin-top: 8px; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
	.plan .per { font-size: 12px; font-weight: 400; color: #67625a; }
	.plan .pick .per { color: #fff; opacity: .85; }
	.plan .cover { padding: 12px 16px 0; font-size: 12px; color: #67625a; }
	.plan .cover .count { float: right; color: #3d3a34; font-variant-numeric: tabular-nums; }
	.plan .meter { clear: both; height: 6px; margin-top: 6px; border-radius: 999px; background: #e5e7eb; overflow: hidden; }
	.plan .meter .fill { height: 6px; border-radius: 999px; background: #3a748d; }
	.plan ul { list-style: none; margin: 0; padding: 12px 16px 14px; font-size: 13px; }
	.plan li { margin: 0 0 8px; padding-left: 24px; position: relative; color: #3d3a34; }
	.plan li .mark { position: absolute; left: 0; top: 1px; width: 16px; height: 16px; line-height: 16px; border-radius: 50%; text-align: center; font-size: 10px; font-weight: 700; background: #e3eef2; color: #2c5d72; }
	.plan li.off { color: #8c867b; }
	.plan li.off .mark { background: #f1f2f4; color: #b5ae9f; font-weight: 400; }
	.plan li .detail { display: block; font-size: 12px; color: #67625a; }
	@media screen and (max-width: 640px) { .plan, .plans-3 .plan, .plans-4 .plan { width: 100%; } }

	/* at a glance: the proposal in four figures */
	.glance { padding-top: 8px; padding-bottom: 8px; }
	.tiles { margin: 0 -6px; font-size: 0; }
	.tile { display: inline-block; vertical-align: top; width: 25%; padding: 6px; font-size: 14px; }
	.tiles-2 .tile { width: 50%; }
	.tiles-3 .tile { width: 33.33%; }
	.tile .in { border: 1px solid #e3ddcd; border-top: 4px solid #3a748d; border-radius: 8px; padding: 12px 14px; }
	.tile .label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #67625a; }
	.tile .value { display: block; margin-top: 6px; font-size: 22px; font-weight: 700; color: #1c1b19; font-variant-numeric: tabular-nums; word-wrap: break-word; }
	.tile .note { display: block; font-size: 12px; color: #67625a; }
	@media screen and (max-width: 640px) { .tile, .tiles-3 .tile { width: 50%; } }

	/* a stacked bar: the investment's split */
	.stack { height: 14px; border-radius: 999px; overflow: hidden; background: #e5e7eb; font-size: 0; white-space: nowrap; }
	.stack .seg { display: inline-block; height: 14px; vertical-align: top; }
	.c0 { background: #2c5d72; } .c1 { background: #3a748d; } .c2 { background: #6595aa; }
	.c3 { background: #93b6c5; } .c4 { background: #bfd4dd; } .tax { background: #9ca3af; }
	.split { margin: 8px 0 18px; }
	.split .legend { margin-top: 10px; }
	.split .legend td { border: 0; padding: 4px 0; font-size: 13px; }
	.split .legend .pc { width: 52px; color: #67625a; }
	.split .sw { display: inline-block; width: 10px; height: 10px; margin-right: 8px; border-radius: 2px; vertical-align: baseline; }

	/* the TBO palette for cards, tiles and steps, in turn: teal, green, orange, red */
	.t0 { border-top-color: #3a748d !important; } .t1 { border-top-color: #0b7d6b !important; }
	.t2 { border-top-color: #e8962a !important; } .t3 { border-top-color: #c4452f !important; }
	.t0 .fig, .t0 .mark-ink { color: #2c5d72; } .t1 .fig { color: #0b7d6b; }
	.t2 .fig { color: #a85a0c; } .t3 .fig { color: #b03a26; }

	/* big-number tiles ("Figure | label | detail") */
	.stats { margin: 10px -6px 14px; font-size: 0; }
	.stat { display: inline-block; vertical-align: top; width: 25%; padding: 6px; font-size: 14px; }
	.stats-1 .stat { width: 100%; } .stats-2 .stat { width: 50%; } .stats-3 .stat { width: 33.33%; }
	.stat .in { min-height: 120px; padding: 14px 16px; background: #f3f4f6; border-top: 4px solid #3a748d; border-radius: 4px; }
	.stat .fig { display: block; font-size: 34px; font-weight: 800; line-height: 1.05; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
	.stat .label { display: block; margin-top: 8px; font-size: 13px; font-weight: 600; color: #1c1b19; }
	.stat .detail { display: block; margin-top: 2px; font-size: 12px; color: #67625a; }

	/* short subsections and deliverables as cards */
	.tcards { margin: 8px -6px 12px; font-size: 0; }
	.tcard { display: inline-block; vertical-align: top; width: 33.33%; padding: 6px; font-size: 14px; }
	.tcards-1 .tcard { width: 100%; } .tcards-2 .tcard { width: 50%; }
	.tcard .in { min-height: 96px; padding: 14px 16px; background: #f3f4f6; border-top: 4px solid #3a748d; border-radius: 4px; }
	.tcard .title { display: block; font-size: 15px; font-weight: 600; color: #1c1b19; }
	.tcard .text { display: block; margin-top: 6px; font-size: 13px; color: #3d3a34; }

	/* numbered rows (out of scope, assumptions) */
	.numbered { list-style: none; margin: 8px 0 12px; padding: 0; }
	.numbered li { position: relative; padding: 8px 0 8px 40px; border-bottom: 1px solid #ece9e1; font-size: 14px; }
	.numbered li:last-child { border-bottom: 0; }
	.numbered .no { position: absolute; left: 0; top: 7px; width: 26px; height: 26px; line-height: 26px; border-radius: 50%; background: #3a748d; color: #fff; font-size: 12px; font-weight: 700; text-align: center; }

	/* a highlight ("> " lines) */
	.callout { margin: 12px 0; padding: 14px 18px; background: #e8f3f0; border-left: 4px solid #0b7d6b; border-radius: 4px; }
	.callout .title { margin: 0; font-size: 16px; font-weight: 600; color: #1c1b19; }
	.callout .tag { display: inline-block; margin-left: 8px; padding: 1px 9px; border-radius: 999px; background: #0b7d6b; color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; vertical-align: middle; }
	.callout p { margin: 6px 0 0; font-size: 14px; color: #3d3a34; }

	/* the implementation plan: numbered markers on a line */
	.phases { list-style: none; margin: 14px -6px 8px; padding: 0; font-size: 0; }
	.phases li { display: inline-block; vertical-align: top; width: 25%; padding: 0 6px 16px; font-size: 14px; text-align: center; position: relative; }
	.phases li:before { content: ""; position: absolute; left: 0; right: 0; top: 18px; border-top: 2px solid #c9ced6; }
	.phases .mark { position: relative; display: inline-block; width: 36px; height: 36px; line-height: 36px; border-radius: 4px; color: #fff; font-size: 16px; font-weight: 800; background: #3a748d; }
	.phases .t1 .mark { background: #0b7d6b; } .phases .t2 .mark { background: #e8962a; color: #1c1b19; } .phases .t3 .mark { background: #c4452f; }
	.phases .name { display: block; margin-top: 10px; font-weight: 700; color: #1c1b19; }
	.phases .text { display: block; margin-top: 4px; font-size: 12px; color: #67625a; }

	/* payment milestones as columns, the amount in a band */
	.paycols { width: 100%; margin: 12px 0 4px; border-collapse: separate; border-spacing: 6px 0; table-layout: fixed; }
	.paycols td { vertical-align: top; padding: 0; border: 0; background: #f3f4f6; }
	.paycols .band { padding: 16px 10px; color: #fff; font-size: 18px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; }
	.paycols .s0 { background: #1d3f52; } .paycols .s1 { background: #2c5d72; } .paycols .s2 { background: #3a748d; } .paycols .s3 { background: #6595aa; }
	.paycols .what { padding: 12px 12px 16px; }
	.paycols .no { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: #2c5d72; text-transform: uppercase; }
	.paycols .label { display: block; margin-top: 6px; font-size: 14px; color: #1c1b19; }
	.paytotal { margin: 14px 0 0; padding-top: 12px; border-top: 2px solid #c9ced6; text-align: right; font-size: 26px; font-weight: 800; color: #1c1b19; font-variant-numeric: tabular-nums; }
	.paytotal span { margin-right: 10px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #67625a; }

	/* the AMC: free support after go-live, then the optional AMC */
	.supportline { width: 100%; margin: 10px 0 6px; border-collapse: separate; border-spacing: 4px 0; table-layout: fixed; }
	.supportline td { padding: 0; border: 0; vertical-align: top; }
	.supportline .when { display: block; margin-bottom: 4px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #67625a; }
	.supportline .paid .when { color: #2c5d72; }
	.supportline .bar { display: block; padding: 9px 12px; color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
	.supportline .free .bar { background: #0b7d6b; }
	.supportline .paid .bar { background: #3a748d; }

	@media screen and (max-width: 640px) {
		.stat, .stats-3 .stat, .tcard { width: 50%; }
		.phases li { width: 50%; }
		.paycols, .paycols tbody, .paycols tr, .paycols td { display: block; width: 100% !important; }
		.paycols td { margin-bottom: 6px; }
	}

	/* a module card's app and effort */
	.effort-total { color: #67625a; font-size: 13px; }
	.card .app { display: block; margin-bottom: 4px; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #3a748d; }
	.card .effort { margin-top: 10px; }
	.card .effort .d { display: block; font-size: 12px; color: #67625a; font-variant-numeric: tabular-nums; }
	.card .effort .track { height: 6px; margin-top: 4px; border-radius: 999px; background: #e5e7eb; overflow: hidden; }
	.card .effort .fill { height: 6px; border-radius: 999px; background: #3a748d; }

	/* the workflow chain */
	.chain { margin: 8px 0 16px; font-size: 0; }
	.step { display: inline-block; white-space: nowrap; vertical-align: middle; margin: 4px 0; padding: 8px 12px; border: 1px solid #cfc7b3; border-radius: 4px; background: #ffffff; font-size: 13px; font-weight: 500; color: #1c1b19; }
	.arrow { display: inline-block; vertical-align: middle; width: 22px; text-align: center; color: #3a748d; font-size: 14px; }

	/* the timeline bar */
	.timeline td { padding: 8px 12px 8px 0; }
	.timeline .track { position: relative; height: 16px; background: #f0eadc; border-radius: 3px; }
	.timeline .bar { position: absolute; top: 0; bottom: 0; background: #3a748d; border-radius: 3px; }
	.timeline .phase { width: 30%; }
	.timeline .weeks { width: 12%; }
	.timeline tfoot td { border-bottom: 0; font-weight: 600; color: #1c1b19; }

	/* images */
	figure { margin: 0 0 16px; page-break-inside: avoid; }
	figure img { display: block; width: 100%; height: auto; border-radius: 4px; border: 1px solid #e3ddcd; }
	figure.half { max-width: 50%; }
	figcaption { margin-top: 6px; font-size: 13px; color: #67625a; }

	/* acceptance */
	.sign { width: 100%; border-collapse: separate; border-spacing: 0; margin: 8px 0 0; page-break-inside: avoid; }
	.sign td { width: 50%; padding: 16px 20px; border: 1px solid #cfc7b3; vertical-align: top; font-weight: 400; }
	.sign td + td { border-left: 0; }
	.sign .who { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #2c5f75; }
	.sign .filled { display: block; margin-top: 14px; min-height: 20px; color: #1c1b19; font-size: 14px; font-weight: 500; }
	.sign .line { display: block; padding-top: 4px; border-top: 1px solid #cfc7b3; font-size: 12px; color: #67625a; }
	.accepted { display: inline-block; margin-top: 12px; padding: 2px 10px; border-radius: 999px; background: #e5f1e8; color: #1f6b45; font-size: 12px; font-weight: 600; }

	/* deciding (the web page only) */
	.decision { margin-top: 32px; padding-top: 28px; padding-bottom: 28px; background: #e7eff1; }
	.decision h2 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
	.decision > p { margin-bottom: 16px; }
	.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
	label { display: block; font-size: 14px; font-weight: 500; color: #3d3a34; margin-bottom: 4px; }
	input, textarea { width: 100%; font: inherit; color: #1c1b19; background: #fff; border: 1px solid #cfc7b3; border-radius: 6px; padding: 10px 12px; min-height: 44px; }
	textarea { min-height: 88px; }
	.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 16px; }
	button, .button { font: inherit; font-weight: 500; border-radius: 6px; padding: 10px 18px; min-height: 44px; cursor: pointer; border: 1px solid #cfc7b3; background: #fff; color: #1c1b19; text-decoration: none; display: inline-flex; align-items: center; }
	button.primary { background: #3a748d; border-color: #3a748d; color: #ffffff; }
	button.primary:hover { background: #2c5f75; }
	button[disabled] { opacity: .6; cursor: progress; }
	:focus-visible { outline: 2px solid #c8641a; outline-offset: 2px; }
	details summary { cursor: pointer; color: #3d3a34; min-height: 44px; display: inline-flex; align-items: center; }
	.error { color: #a32116; font-size: 14px; margin-top: 8px; }
	.page-foot { padding-top: 16px; padding-bottom: 16px; color: #67625a; font-size: 13px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; border-top: 1px solid #e3ddcd; }
