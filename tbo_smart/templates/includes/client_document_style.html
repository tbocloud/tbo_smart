{#- the ivory paper of every client document's page and PDF (docs/proposals.md §5.1) #}
<style>
	{%- for face in p.fonts or [] %}
	@font-face { font-family: Geist; font-style: normal; font-weight: {{ face.weight }}; src: url("{{ face.src }}"); }
	{%- endfor %}
	/* One theme: ivory paper (#fbf8ef), dark ink (#1c1b19), the TBO teal (#3a748d) only for
	   numbers, the headings' rule and the timeline. Readable in grayscale: nothing depends on the
	   colour alone. Colours are written out, not CSS variables: wkhtmltopdf's WebKit has none, nor
	   flexbox or grid. One font, Geist, bundled with tabular figures (docs/proposals.md §5.1). */
	* { box-sizing: border-box; }
	html { background: #fbf8ef; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
	body {
		margin: 0; background: #fbf8ef; color: #1c1b19;
		font: 15px/1.65 Geist, "Helvetica Neue", Helvetica, Arial, sans-serif;
	}
	.wrap { max-width: 880px; margin: 0 auto; padding: 32px 16px 64px; }
	.sheet { background: #fffdf7; border: 1px solid #e3ddcd; border-radius: 4px; }
	.pad { padding-left: 56px; padding-right: 56px; }

	/* letter head */
	.letter-head { padding-top: 20px; padding-bottom: 16px; border-bottom: 1px solid #e3ddcd; }
	.letter-head-footer { padding-top: 12px; padding-bottom: 16px; border-top: 1px solid #e3ddcd; color: #67625a; font-size: 12px; }
	.letter-head img, .letter-head-footer img { max-width: 100%; max-height: 90px; }
	.align-center { text-align: center; }
	.align-right { text-align: right; }
	header.brand { padding-top: 20px; padding-bottom: 16px; border-bottom: 1px solid #e3ddcd; }
	header.brand img { max-height: 40px; max-width: 180px; vertical-align: middle; }
	header.brand .company { font-weight: 600; color: #3d3a34; }

	/* the cover */
	.cover { padding-top: 72px; padding-bottom: 56px; }
	.cover table { margin: 0; page-break-inside: auto; }
	.cover td { padding: 0; border-bottom: 0; color: inherit; font-weight: 400; }
	.cover-grid { width: 100%; }
	.cover-grid td.top { vertical-align: top; }
	.cover-grid td.bottom { vertical-align: bottom; padding-top: 48px; }
	.cover .logo { max-height: 56px; max-width: 220px; margin-bottom: 48px; }
	.kicker { margin: 0 0 16px; color: #2c5f75; font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
	.cover h1 { margin: 0; font-size: 40px; line-height: 1.15; font-weight: 600; letter-spacing: -.01em; color: #1c1b19; }
	.cover .rule { width: 72px; height: 4px; background: #3a748d; margin: 28px 0; }
	.cover .tagline p { font-size: 17px; color: #3d3a34; margin: 20px 0 0; }
	.cover figure { margin: 32px 0 0; }
	.facts { width: 100%; border-collapse: collapse; }
	.cover .facts td { width: 33.3%; padding: 12px 16px 12px 0; border-top: 1px solid #e3ddcd; vertical-align: top; font-weight: 400; }
	.facts .label { display: block; color: #67625a; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
	.facts .value { display: block; margin-top: 2px; color: #1c1b19; font-variant-numeric: tabular-nums; }
	.cover .cover-foot { width: 100%; margin-top: 24px; }
	.cover .cover-foot td { padding-top: 10px; border-top: 1px solid #cfc7b3; color: #67625a; font-size: 12px; font-weight: 400; }

	/* notices (the web page only) */
	.notice { margin: 16px 0 0; padding: 12px 16px; border-radius: 6px; font-size: 14px; }
	.notice.info { background: #e7eff1; color: #2c5f75; }
	.notice.success { background: #e5f1e8; color: #1f6b45; }
	.notice.danger { background: #f8e5e1; color: #a32116; }
	.notice strong { font-weight: 600; }

	/* contents */
	.toc { padding-top: 48px; padding-bottom: 40px; border-top: 1px solid #e3ddcd; }
	.toc h2 { margin: 0 0 12px; font-size: 24px; font-weight: 600; }
	.toc .part-title { margin: 14px 0 4px; color: #2c5f75; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
	.toc ol { list-style: none; margin: 0; padding: 0; }
	.toc li { padding: 3px 0; font-size: 14px; border-bottom: 1px dotted #cfc7b3; color: #3d3a34; }
	.toc a { color: inherit; text-decoration: none; }
	.toc .n { display: inline-block; width: 36px; color: #2c5f75; font-variant-numeric: tabular-nums; }

	/* parts and sections */
	.part { padding-top: 48px; padding-bottom: 8px; border-top: 1px solid #e3ddcd; }
	.part p { margin: 0; color: #2c5f75; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
	section.block { padding-top: 32px; padding-bottom: 8px; }
	/* a heading never ends a page: it is kept with the first thing under it */
	.keep { page-break-inside: avoid; }
	section.block h2 { margin: 0 0 16px; padding-bottom: 10px; border-bottom: 2px solid #3a748d; font-size: 22px; line-height: 1.3; font-weight: 600; page-break-after: avoid; }
	section.block h2 .n { color: #2c5f75; margin-right: 12px; font-weight: 500; }
	h3 { margin: 22px 0 8px; font-size: 16px; font-weight: 600; color: #1c1b19; page-break-after: avoid; }
	h3 .n { color: #2c5f75; margin-right: 8px; font-weight: 500; }
	p { margin: 0 0 12px; color: #3d3a34; }
	ul { margin: 0 0 12px; padding-left: 20px; color: #3d3a34; }
	li { margin-bottom: 4px; }

	/* tables */
	table { width: 100%; border-collapse: collapse; margin: 8px 0 16px; font-size: 14px; page-break-inside: avoid; }
	thead { display: table-header-group; }
	tr { page-break-inside: avoid; }
	th { text-align: left; font-weight: 600; color: #67625a; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; padding: 8px 12px 8px 0; border-bottom: 1px solid #cfc7b3; }
	td { padding: 10px 12px 10px 0; border-bottom: 1px solid #e3ddcd; vertical-align: top; color: #3d3a34; }
	td:first-child { color: #1c1b19; font-weight: 500; }
	.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-right: 0; }
	td .desc { display: block; color: #67625a; font-size: 13px; font-weight: 400; margin-top: 2px; }
	.totals { width: 55%; margin-left: 45%; }
	.totals td { border-bottom: 0; padding: 5px 0; font-weight: 400; }
	.totals tr.grand td { padding-top: 12px; border-top: 2px solid #1c1b19; font-weight: 600; font-size: 17px; color: #1c1b19; }
	.words { font-size: 13px; color: #67625a; text-align: right; }

	/* the module map */
	.cards { margin: 4px -6px 12px; font-size: 0; }
	.card { display: inline-block; vertical-align: top; width: 50%; padding: 6px; font-size: 14px; page-break-inside: avoid; }
	.card .in { border: 1px solid #e3ddcd; border-top: 3px solid #3a748d; border-radius: 4px; background: #fffdf7; padding: 14px 16px; min-height: 128px; }
	.card .name { font-weight: 600; color: #1c1b19; }
	.card .fit { display: inline-block; margin-left: 6px; padding: 0 8px; border: 1px solid #cfc7b3; border-radius: 999px; font-size: 11px; color: #67625a; }
	.card .about { margin: 8px 0 0; font-size: 13px; color: #3d3a34; }
	.card ul { margin: 8px 0 0; font-size: 13px; }

	/* the workflow chain */
	.chain { margin: 8px 0 16px; font-size: 0; }
	.step { display: inline-block; white-space: nowrap; vertical-align: middle; margin: 4px 0; padding: 8px 12px; border: 1px solid #cfc7b3; border-radius: 4px; background: #fffdf7; font-size: 13px; font-weight: 500; color: #1c1b19; }
	.arrow { display: inline-block; vertical-align: middle; width: 22px; text-align: center; color: #3a748d; font-size: 14px; }

	/* the timeline bar */
	.timeline td { padding: 8px 12px 8px 0; }
	.timeline .track { position: relative; height: 16px; background: #f0eadc; border-radius: 3px; }
	.timeline .bar { position: absolute; top: 0; bottom: 0; background: #3a748d; border-radius: 3px; }
	.timeline .phase { width: 30%; }
	.timeline .weeks { width: 12%; }
	.timeline tfoot td { border-bottom: 0; font-weight: 600; color: #1c1b19; }

	/* images */
	figure { margin: 0 0 16px; page-break-inside: avoid; }
	figure img { display: block; width: 100%; height: auto; border-radius: 4px; border: 1px solid #e3ddcd; }
	figure.half { max-width: 50%; }
	figcaption { margin-top: 6px; font-size: 13px; color: #67625a; }

	/* acceptance */
	.sign { width: 100%; border-collapse: separate; border-spacing: 0; margin: 8px 0 0; page-break-inside: avoid; }
	.sign td { width: 50%; padding: 16px 20px; border: 1px solid #cfc7b3; vertical-align: top; font-weight: 400; }
	.sign td + td { border-left: 0; }
	.sign .who { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #2c5f75; }
	.sign .filled { display: block; margin-top: 14px; min-height: 20px; color: #1c1b19; font-size: 14px; font-weight: 500; }
	.sign .line { display: block; padding-top: 4px; border-top: 1px solid #cfc7b3; font-size: 12px; color: #67625a; }
	.accepted { display: inline-block; margin-top: 12px; padding: 2px 10px; border-radius: 999px; background: #e5f1e8; color: #1f6b45; font-size: 12px; font-weight: 600; }

	/* deciding (the web page only) */
	.decision { margin-top: 32px; padding-top: 28px; padding-bottom: 28px; background: #e7eff1; }
	.decision h2 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
	.decision > p { margin-bottom: 16px; }
	.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
	label { display: block; font-size: 14px; font-weight: 500; color: #3d3a34; margin-bottom: 4px; }
	input, textarea { width: 100%; font: inherit; color: #1c1b19; background: #fff; border: 1px solid #cfc7b3; border-radius: 6px; padding: 10px 12px; min-height: 44px; }
	textarea { min-height: 88px; }
	.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 16px; }
	button, .button { font: inherit; font-weight: 500; border-radius: 6px; padding: 10px 18px; min-height: 44px; cursor: pointer; border: 1px solid #cfc7b3; background: #fff; color: #1c1b19; text-decoration: none; display: inline-flex; align-items: center; }
	button.primary { background: #3a748d; border-color: #3a748d; color: #ffffff; }
	button.primary:hover { background: #2c5f75; }
	button[disabled] { opacity: .6; cursor: progress; }
	:focus-visible { outline: 2px solid #c8641a; outline-offset: 2px; }
	details summary { cursor: pointer; color: #3d3a34; min-height: 44px; display: inline-flex; align-items: center; }
	.error { color: #a32116; font-size: 14px; margin-top: 8px; }
	.page-foot { padding-top: 16px; padding-bottom: 16px; color: #67625a; font-size: 13px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; border-top: 1px solid #e3ddcd; }
	.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
	/* the questionnaire (/questions/<token>) */
	.questionnaire { padding-bottom: 24px; }
	.questionnaire .progress { font-family: "Geist Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; color: #67625a; }
	.question { margin: 0 0 20px; }
	.question label { font-weight: 500; color: #1c1b19; }
	.save-bar { position: sticky; bottom: 0; padding: 12px 0; background: #fffdf7; border-top: 1px solid #e3ddcd; }
	.saved { color: #1f6b45; font-size: 14px; }
	/* the PDF: A4, 18 mm on every side (proposals.pdf_page); body 10.5 pt, headings 22/14.5/12 pt,
	   tables 9.5 pt; one grid: the numbers of headings and contents in one 12 mm column */
	.pdf body { font-size: 10.5pt; line-height: 1.45; }
	.pdf .wrap { max-width: none; padding: 0; }
	.pdf .sheet { background: transparent; border: 0; border-radius: 0; }
	.pdf .pad { padding-left: 18mm; padding-right: 18mm; }
	.pdf p, .pdf ul { margin-bottom: 2.5mm; }
	.pdf li { margin-bottom: 1mm; }
	.pdf .n { display: inline-block; width: 12mm; margin-right: 0; }
	.pdf .cover { padding-top: 0; padding-bottom: 0; page-break-after: always; }
	.pdf .cover td { padding: 0; }
	.pdf .cover-grid td.top { padding-top: 34mm; }
	.pdf .cover-grid td.bottom { padding-top: 10mm; }
	.pdf .cover .logo { max-height: 14mm; margin-bottom: 10mm; }
	.pdf .kicker { margin-bottom: 4mm; font-size: 9pt; }
	.pdf .cover h1 { font-size: 22pt; line-height: 1.2; }
	.pdf .cover .rule { width: 16mm; height: 1.5pt; margin-top: 7mm; }
	.pdf .cover .tagline p { margin-top: 7mm; font-size: 11pt; line-height: 1.45; }
	.pdf .cover figure { margin-top: 8mm; }
	.pdf .cover figure img { width: auto; max-width: 100%; max-height: 80mm; }
	.pdf .cover .facts td { padding: 3mm 4mm 3mm 0; }
	.pdf .facts .label { font-size: 8pt; }
	.pdf .facts .value { margin-top: .5mm; font-size: 10.5pt; }
	.pdf .cover .cover-foot { margin-top: 8mm; }
	.pdf .cover .cover-foot td { padding-top: 2.5mm; font-size: 8pt; }
	.pdf .toc { border-top: 0; padding-top: 0; padding-bottom: 0; page-break-after: always; }
	.pdf .toc h2 { margin-bottom: 4mm; font-size: 14.5pt; line-height: 1.3; }
	.pdf .toc .part-title { margin: 6mm 0 1.5mm; font-size: 9pt; }
	.pdf .toc li { margin: 0; padding: 0; border-bottom: 0; font-size: 10.5pt; line-height: 1.95; overflow: hidden; }
	/* dot leaders: a row of dots behind the heading and the page number, each on the paper colour */
	.leaders li:before { float: left; width: 0; white-space: nowrap; color: #b4ab95; content: ". . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . ."; }
	.leaders .t { padding-right: 1.5mm; background: #fbf8ef; }
	.leaders .pg { float: right; position: relative; z-index: 1; padding-left: 1.5mm; background: #fbf8ef; color: #1c1b19; }
	.pdf .part { padding-top: 0; padding-bottom: 0; border-top: 0; page-break-before: always; }
	.pdf .part p { font-size: 9pt; }
	.pdf section.block { padding-top: 7mm; padding-bottom: 0; }
	.pdf section.block h2 { margin-bottom: 4mm; padding-bottom: 2mm; border-bottom-width: 1.5pt; font-size: 14.5pt; line-height: 1.3; }
	.pdf h3 { margin: 5mm 0 2mm; font-size: 12pt; line-height: 1.3; }
	.pdf table { margin-top: 2mm; margin-bottom: 4mm; font-size: 9.5pt; }
	.pdf th { padding: 1.5mm 3mm 1.5mm 0; font-size: 9.5pt; letter-spacing: 0; text-transform: none; }
	.pdf td { padding: 2mm 3mm 2mm 0; }
	.pdf th.num, .pdf td.num { padding-left: 3mm; padding-right: 0; }
	.pdf td .desc { font-size: 9.5pt; }
	.pdf .totals td { padding: 1.2mm 0; }
	.pdf .totals tr.grand td { padding-top: 3mm; font-size: 12pt; }
	.pdf .words { font-size: 9.5pt; }
	.pdf .card { font-size: 9.5pt; }
	.pdf .card .in { min-height: 0; padding: 3.5mm 4mm; }
	.pdf .card .about, .pdf .card ul { font-size: 9.5pt; }
	.pdf .card .fit { font-size: 8pt; }
	.pdf .step { padding: 1.5mm 2.5mm; font-size: 9.5pt; }
	.pdf .arrow { width: 6mm; font-size: 10pt; }
	.pdf .timeline td { padding: 1.5mm 3mm 1.5mm 0; }
	.pdf figcaption { font-size: 9pt; }
	.pdf .sign td { padding: 4mm 5mm; }
	.pdf .sign .who { font-size: 8pt; }
	.pdf .sign .filled { margin-top: 4mm; font-size: 10.5pt; }
	.pdf .sign .line { font-size: 8pt; }
	/* the running header and footer: Frappe's get_pdf renders them as pages of their own, without
	   the pdf class; its own rules pull .letter-head and .letter-head-footer up by the body's 15 mm */
	.running-head { margin: 0 18mm; padding: 18mm 0 3mm; border-bottom: 1px solid #cfc7b3; }
	.running-head img { max-width: 100%; max-height: none; }
	.running-head .company { font-size: 11pt; font-weight: 600; color: #3d3a34; }
	.running-foot { margin: 0 18mm; padding-top: 3.2mm; border-top: 0; color: #67625a; font-size: 8pt; line-height: 1.3; }
	.running-foot .in { padding: 2.5mm 22mm 0 0; border-top: 1px solid #cfc7b3; overflow: hidden; white-space: nowrap; text-align: left; }
	.running-foot .in * { margin: 0 !important; color: #67625a !important; font-size: 8pt !important; text-align: left !important; }
	.running-foot img { max-width: 100%; max-height: 8mm; }
	@media screen and (max-width: 640px) {
		.wrap { padding: 0 0 32px; }
		.sheet { border-radius: 0; border-left: 0; border-right: 0; }
		.pad { padding-left: 16px; padding-right: 16px; }
		.cover { padding-top: 40px; }
		.cover h1 { font-size: 30px; }
		.cover .facts td { display: block; width: 100%; }
		.card { width: 100%; }
		figure.half { max-width: 100%; }
		.fields { grid-template-columns: 1fr; }
		.totals { width: 100%; margin-left: 0; }
		th.hide-sm, td.hide-sm { display: none; }
		.sign td { display: block; width: 100%; }
		.sign td + td { border-left: 1px solid #cfc7b3; border-top: 0; }
	}
	@media print {
		html, body, .wrap { background: #fbf8ef; padding: 0; }
		.sheet { border: 0; background: transparent; }
		.decision, .no-print, .notice.preview { display: none; }
		.cover, .toc { page-break-after: always; }
		.part { page-break-before: always; }
	}
	@media (prefers-reduced-motion: no-preference) { button { transition: background-color .15s; } }
</style>
